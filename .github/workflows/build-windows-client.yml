name: Build Windows Game Booster

on:
  push:
    paths:
      - 'client-windows/**'
      - '.github/workflows/build-windows-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore client-windows/GameBooster.csproj

      - name: Publish Single-File Executable
        run: >
          dotnet publish client-windows/GameBooster.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o publish/

      - name: Copy Config and Installer
        run: |
          copy client-windows\config.json publish\config.json
          copy client-windows\install.bat publish\install.bat

      - name: Upload Windows Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBooster-Windows-x64
          path: publish/

      - name: Zip Setup Package
        run: Compress-Archive -Path publish\* -DestinationPath GameBooster-Windows-Setup.zip -Force

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "Game Booster Windows Setup v1.2.0 (Direct 60 FPS LAN/WAN Control)"
          body: |
            ### ⚡ Game Booster v1.2.0 Release:
            - **Fully Rebranded to Game Booster**: Executable, background tasks, service entries, and tray controls are now Game Booster.
            - **Direct LAN & WAN 60 FPS Remote Control**: Built-in ultra-low latency direct streaming (<3ms latency) over port 48999.
            - **UPnP Auto-Port Forwarding**: Automatically requests router port mapping for seamless Internet WAN streaming.
            - **Tailscale Mesh Integration**: Native discovery of Tailscale encrypted P2P IP.
            - **Interactive Remote Input**: Real-time mouse and keyboard control with Win32 `SendInput`.
            - **Automated Installer & Migration**: `install.bat` cleanly migrates prior configs and registers highest-privilege auto-start.
          files: GameBooster-Windows-Setup.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
