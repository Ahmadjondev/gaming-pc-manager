name: Build Windows Gaming Agent

on:
  push:
    paths:
      - 'client-windows/**'
      - '.github/workflows/build-windows-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore client-windows/GameRoomAgent.csproj

      - name: Publish Single-File Executable
        run: >
          dotnet publish client-windows/GameRoomAgent.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o publish/

      - name: Copy Config and Installer
        run: |
          copy client-windows\config.json publish\config.json
          copy client-windows\install.bat publish\install.bat

      - name: Upload Windows Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameRoomAgent-Windows-x64
          path: publish/

      - name: Zip Setup Package
        run: Compress-Archive -Path publish\* -DestinationPath GameRoomAgent-Windows-Setup.zip -Force

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "GameRoomAgent Windows Setup v1.1.0 (Direct High-FPS LAN Control)"
          body: |
            ### ⚡ What's New in v1.1.0:
            - **Direct LAN 60 FPS Remote Control**: Built-in ultra-low latency direct streaming (<3ms latency) over port 48999.
            - **Interactive Remote Input**: Real-time mouse and keyboard control with Win32 `SendInput`.
            - **Firewall Auto-Configuration**: `install.bat` automatically opens port 48999 and reserves URL ACL.
            - **Zero Cloud Video Bandwidth**: Render serves solely as the signaling meeting point.
          files: GameRoomAgent-Windows-Setup.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
