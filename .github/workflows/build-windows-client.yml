name: Build Windows Game Booster

on:
  push:
    paths:
      - 'client-windows/**'
      - '.github/workflows/build-windows-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore client-windows/GameBooster.csproj

      - name: Publish Single-File Executable
        run: >
          dotnet publish client-windows/GameBooster.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o publish/

      - name: Copy Config and Installer
        run: |
          copy client-windows\config.json publish\config.json
          copy client-windows\install.bat publish\install.bat

      - name: Upload Windows Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBooster-Windows-x64
          path: publish/

      - name: Zip Setup Package
        run: Compress-Archive -Path publish\* -DestinationPath GameBooster-Windows-Setup.zip -Force

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.1
          name: "Game Booster Windows Setup v1.2.1 (Files, Hidden Files & Direct LAN/WAN)"
          body: |
            ### ⚡ Game Booster v1.2.1 Release:
            - **Safe Remote File Explorer**: Fixed directory enumeration hangs on Windows junction points (`Application Data`, `$RECYCLE.BIN`, `System Volume Information`).
            - **Hidden & System Files Enumeration**: Full visibility for hidden files/folders with dedicated indicators and toggle in the Mac manager.
            - **Remote Folder & File Management**: Create new directories and delete items with instant UI updates across Direct LAN and Cloud Relay.
            - **Direct LAN & WAN 60 FPS Remote Control**: Built-in ultra-low latency direct streaming (<3ms latency) over port 48999.
            - **UPnP & Tailscale Mesh**: Auto-discovery and port forwarding for seamless local and remote connections.
          files: GameBooster-Windows-Setup.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
